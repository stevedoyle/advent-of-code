repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/psf/black
  rev: 22.10.0
  hooks:
  - id: black
- repo: https://github.com/dnephin/pre-commit-golang
  rev: v0.5.1
  hooks:
  - id: go-fmt
  - id: go-imports
  - id: golangci-lint
  - id: go-unit-tests
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v18.1.4
  hooks:
  - id: clang-format
- repo: local
  hooks:
  - id: cargo-fmt-2026
    name: cargo fmt (2026)
    entry: cargo fmt --manifest-path 2026/Cargo.toml
    language: system
    files: ^2026/.*\.rs$
    pass_filenames: false
  - id: cargo-clippy-2026
    name: cargo clippy (2026)
    entry: cargo clippy --manifest-path 2026/Cargo.toml --all-targets -- -D warnings
    language: system
    files: ^2026/.*\.rs$
    pass_filenames: false
